<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="leafGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#0B6B4F" />
    </linearGradient>
    <linearGradient id="leafGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#044E36" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A7F3D0" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0B6B4F" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background Soft Pill (Optional / Transparent in SVG) -->
  <rect width="200" height="200" rx="48" fill="#E6F5EF" />

  <!-- Modern Stylized Twin Leaf / Eco Growth Emblem -->
  <g filter="url(#softGlow)" transform="translate(10, 10) scale(0.9)">
    <!-- Primary Main Leaf -->
    <path
      d="M100 25 C145 25, 175 65, 175 115 C175 155, 140 175, 100 175 C95 175, 90 174, 85 172 C80 150, 85 110, 100 80 C110 60, 100 35, 100 25 Z"
      fill="url(#leafGrad1)"
    />

    <!-- Secondary Overlapping Leaf -->
    <path
      d="M100 175 C60 175, 25 145, 25 105 C25 65, 60 40, 100 25 C92 45, 90 80, 75 110 C65 130, 75 160, 100 175 Z"
      fill="url(#leafGrad2)"
    />

    <!-- Central Vein / Life Stem -->
    <path
      d="M100 28 C98 70, 92 120, 100 175"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="5"
      stroke-linecap="round"
      opacity="0.85"
    />

    <!-- Subtle Vein Branches -->
    <path
      d="M97 75 C115 65, 135 70, 148 80"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="3"
      stroke-linecap="round"
      opacity="0.6"
    />
    <path
      d="M96 110 C115 102, 135 110, 146 122"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="3"
      stroke-linecap="round"
      opacity="0.6"
    />
    <path
      d="M94 92 C78 82, 60 88, 48 98"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="3"
      stroke-linecap="round"
      opacity="0.6"
    />
    <path
      d="M97 130 C80 122, 64 128, 52 140"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="3"
      stroke-linecap="round"
      opacity="0.6"
    />

    <!-- Fresh Morning Dew / Innovation Spark -->
    <circle cx="138" cy="58" r="6" fill="url(#accentGrad)" opacity="0.9" />
  </g>
</svg>
