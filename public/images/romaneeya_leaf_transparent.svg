<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="leafTGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#0B6B4F" />
    </linearGradient>
    <linearGradient id="leafTGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#044E36" />
    </linearGradient>
    <linearGradient id="accentTGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Transparent Background Leaf Logo for Documents and Invoices -->
  <g transform="translate(10, 10) scale(0.9)">
    <!-- Primary Main Leaf -->
    <path
      d="M100 20 C150 20, 180 65, 180 118 C180 160, 142 180, 100 180 C95 180, 90 179, 85 177 C80 152, 85 110, 100 78 C110 58, 100 32, 100 20 Z"
      fill="url(#leafTGrad1)"
    />

    <!-- Secondary Overlapping Leaf -->
    <path
      d="M100 180 C58 180, 20 148, 20 106 C20 62, 58 36, 100 20 C92 42, 90 78, 75 110 C64 132, 74 164, 100 180 Z"
      fill="url(#leafTGrad2)"
    />

    <!-- Central Vein / Life Stem -->
    <path
      d="M100 24 C98 68, 92 120, 100 178"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="5"
      stroke-linecap="round"
      opacity="0.9"
    />

    <!-- Subtle Vein Branches -->
    <path
      d="M97 75 C116 64, 138 70, 150 82"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="3"
      stroke-linecap="round"
      opacity="0.65"
    />
    <path
      d="M96 112 C116 104, 137 112, 149 125"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="3"
      stroke-linecap="round"
      opacity="0.65"
    />
    <path
      d="M94 92 C76 81, 58 87, 46 98"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="3"
      stroke-linecap="round"
      opacity="0.65"
    />
    <path
      d="M97 132 C78 123, 62 130, 50 142"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="3"
      stroke-linecap="round"
      opacity="0.65"
    />

    <!-- Dewdrop Accent -->
    <circle cx="140" cy="56" r="6.5" fill="url(#accentTGrad)" opacity="0.95" />
  </g>
</svg>
